[project]
name = "tool-effect-bench"
version = "0.1.0"
description = "ToolEffectBench: an Inspect eval that scores tool-using agents from persisted sandbox state"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Yusef Syed" }]
dependencies = ["inspect-ai>=0.3.285"]

[project.entry-points.inspect_ai]
tool_effect_bench = "tool_effect_bench"

[dependency-groups]
# Provider SDKs used only for the baseline runs; the eval itself needs none.
baselines = [
    "aioboto3>=15.5.0",
    "anthropic>=0.80",
    "openai>=1.100",
]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.0.0",
  "ruff==0.15.11",
  "mypy==2.1.0",
  "inspect-evals-lint==0.12.0",
  "pyyaml>=6.0",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_effect_bench"]

[tool.inspect-evals-lint]
preset = "single-eval"
# IETS008 asks for the pytest-inspect-evals epoch helper; the three grouped means
# are tested directly (tests/test_metrics.py) and through the mock loop
# (tests/test_mock_loop.py); the epoch reducer is Inspect's own default mean.
# IECQ001: inspect_ai has no public accessor for the running sample's messages
# inside a tool; adaptive.py needs them and uses the one Inspect's own tools use.
per-file-ignores = { "src/tool_effect_bench/scorer.py" = ["IETS008"], "src/tool_effect_bench/adaptive.py" = ["IECQ001"] }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"
# The sandbox helpers are shipped into the container byte-identical to the
# Mutation Lab originals.
extend-exclude = ["src/tool_effect_bench/sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
extend-select = ["PLW1514"]
preview = true
explicit-preview-rules = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tool_effect_bench"]
# The sandbox helpers are shipped into the container byte-identical to the
# Mutation Lab originals; they are not imported by the package.
exclude = ["src/tool_effect_bench/sandbox/"]
